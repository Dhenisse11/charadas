<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>El reto de las Señas Saladas · Sal Celestial</title>
<style>
:root{--navy:#0d1b3e;--navy2:#142a5e;--yel:#f7c52b;--cream:#f8f1dc;--ink:#14224d;--ok:#37c978;--bad:#ff6b5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,var(--navy2),var(--navy));color:#fff;font-family:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.brush{font-family:"Marker Felt","Chalkboard SE","Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-weight:800}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(12px,3vw,28px)}
.logo{background:#fff;border-radius:14px;padding:6px 14px;display:flex;box-shadow:0 4px 14px #0006}
.logo img{height:clamp(30px,6vh,52px);width:auto;display:block}
.tag{font-size:clamp(11px,1.8vw,16px);opacity:.9;text-align:right;line-height:1.2}
main{flex:1;min-height:0;display:grid;gap:clamp(10px,2vw,22px);padding:6px clamp(12px,3vw,28px) 10px;grid-template-rows:1fr auto}
.stage{background:var(--cream);color:var(--ink);border-radius:22px;padding:clamp(14px,3vw,30px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(8px,2vh,18px);position:relative;box-shadow:0 10px 30px #0006;min-height:0}
.chip{background:var(--yel);color:var(--ink);padding:2px 16px;border-radius:6px;transform:rotate(-2deg);font-size:clamp(20px,4vw,38px)}
.reto{font-size:clamp(22px,4.6vw,44px);line-height:1.2;margin:0;font-weight:800;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.ico{font-size:clamp(34px,7vh,64px);line-height:1}
.timer{position:relative;width:clamp(86px,17vh,150px);aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .bg{stroke:#14224d22}.timer .fg{stroke:var(--ink);transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low .fg{stroke:var(--bad)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(28px,6vh,54px)}
.big{font-size:clamp(26px,6vw,56px);margin:0;line-height:1.1}
.sub{margin:0;font-size:clamp(14px,2.4vw,22px)}
.btn{border:0;border-radius:16px;padding:clamp(12px,2.2vh,20px) clamp(14px,2.4vw,26px);font:inherit;font-weight:800;font-size:clamp(15px,2.6vw,24px);cursor:pointer;transition:transform .1s,opacity .2s;color:#fff}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.go{background:var(--yel);color:var(--ink);font-size:clamp(20px,4vw,34px);padding:14px 38px}
.panel{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);min-height:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vw,14px)}
.yes{background:var(--ok);color:#06301a}.no{background:var(--bad);color:#3a0c07}
.alt{background:#ffffff1f;border:2px solid #ffffff55}
.prizes{background:#0a1530;border-radius:18px;padding:10px 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:clamp(10px,1.6vw,14px)}
.prizes div{padding:0 3px;border-right:1px solid #ffffff22}.prizes div:last-child{border:0}
.prizes i{display:block;font-style:normal;font-size:clamp(20px,3.6vw,30px)}
.prizes strong{color:var(--yel);display:block;font-size:1.15em}
.res{position:absolute;inset:0;background:var(--cream);border-radius:22px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,14px);padding:16px;text-align:center}
.res.on{display:flex;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.res.win .big{color:#12994f}.res.lose .big{color:#d6382b}
.prize{background:var(--ink);color:#fff;border-radius:16px;padding:10px 20px;font-size:clamp(16px,3vw,28px);font-weight:800}
.prize small{display:block;font-weight:600;font-size:.6em;color:var(--yel)}
.ig{background:linear-gradient(45deg,#f9a03c,#e1306c,#833ab4);color:#fff;border-radius:999px;padding:8px 20px;font-weight:800;font-size:clamp(14px,2.6vw,22px)}
@media (orientation:landscape) and (min-width:640px){
 main{grid-template-columns:1.25fr 1fr;grid-template-rows:1fr}
 .panel{justify-content:center}
 .btns{grid-template-columns:1fr}
}
@media (orientation:landscape) and (max-height:480px){.tag{display:none}.timer{width:80px}.ico{display:none}}
.salt{position:fixed;top:-10px;pointer-events:none;font-size:20px;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}

header .right{display:flex;align-items:center;gap:8px}
.score{display:flex;gap:6px;font-weight:800;font-size:clamp(12px,2vw,16px)}
.score span{background:#ffffff1f;border-radius:999px;padding:4px 10px;white-space:nowrap}
.ib{background:#ffffff1f;border:0;color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.stage{background:repeating-linear-gradient(180deg,var(--cream) 0 33px,#14224d14 33px 34px)}
.stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:22px 0 0 22px;background:repeating-linear-gradient(180deg,var(--yel) 0 14px,transparent 14px 28px)}
.shaker{font-size:clamp(46px,10vh,86px);animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
.go{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #f7c52baa}70%{box-shadow:0 0 0 18px #f7c52b00}100%{box-shadow:0 0 0 0 #f7c52b00}}
.timer{cursor:pointer}.timer.low{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:none}25%{transform:scale(1.06) rotate(-3deg)}75%{transform:scale(1.06) rotate(3deg)}}
.pausa{position:absolute;inset:0;background:#0d1b3ee6;border-radius:22px;display:none;place-items:center;font-size:clamp(28px,6vw,52px);z-index:5;text-align:center;cursor:pointer}
.pausa.on{display:grid}
.ticket{border:3px dashed var(--yel);background:var(--ink)}
.res .sub{color:var(--ink)}
.sm{background:var(--ink);color:#fff;font-size:clamp(14px,2.4vw,20px);padding:10px 22px}
[hidden]{display:none!important}
</style></head><body>
